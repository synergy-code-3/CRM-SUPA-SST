name: Sincronizar Kajabi

# El cron real vive en Vercel (ver vercel.json) — el "schedule" de GitHub
# Actions no era confiable para intervalos cortos (llegó a tardar horas en
# dispararse). Este workflow se deja solo para correrlo a mano si hace
# falta (Actions → Sincronizar Kajabi → Run workflow).
on:
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de sincronización
        run: |
          curl -sf -X POST "https://soporte.sinergeticos.com/api/cron/sincronizar-kajabi?token=${{ secrets.CRON_SECRET }}"
